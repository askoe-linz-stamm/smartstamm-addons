# Keeps the netzmessung add-on current: every three days the script bumps the
# add-on version (the Supervisor then rebuilds the image on the device with
# current Alpine packages), moves the base image to the newest 3.x tag, adopts
# new Ookla CLI versions and rebuilds the RMBT client when its upstream changed.
# Runs natively on arm64; nothing changed: about one minute, RMBT rebuild: a few
# minutes. Hard limit 15 minutes so a hang cannot burn Actions minutes.
name: Update netzmessung
on:
  schedule:
    - cron: "17 4 */3 * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write   # failure report below
concurrency:
  group: update-netzmessung
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Update add-on from upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/update.sh
      # A failed run opens one issue labelled `automatisch`; later failures comment on it.
      - name: Report failure as issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Update-Workflow netzmessung fehlgeschlagen"
          open=$(gh issue list --label automatisch --state open --search "in:title \"${title}\"" --json number --jq '.[0].number')
          if [ -n "${open}" ]; then
            gh issue comment "${open}" --body "Erneut fehlgeschlagen: ${RUN_URL}"
          else
            gh issue create --label automatisch --title "${title}" --body "Der geplante Update-Workflow ist fehlgeschlagen: ${RUN_URL}

          Das Add-on auf SmartStamm läuft mit der letzten Version weiter. Log des Laufs prüfen; das Skript lässt sich lokal mit \`DRY_RUN=1\` testen (siehe README)."
          fi
